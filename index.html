<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планер</title>
<meta name="theme-color" content="#F5EEE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
:root, html[data-season="autumn"]{
  --bg:#F5EEE4; --card:#FFFFFF; --ink:#3B2F27; --muted:#9C8C7C;
  --hair:#E6DACB; --plum:#6F5540; --plum-soft:#EFE3D3; --sage:#96A68C;
  --amber:#A97C4F; --red:#B0614E; --mark-x:#D8CBB8;
  --blk1:#EFE1D3; --blk2:#E4CBB0; --blk3:#D8B694; --blk4:#C79B75; --blk5:#A9805E; --blk6:#8B6547;
  --fx-color:#B5652E;
}
html[data-theme="dark"], html[data-season="autumn"][data-theme="dark"]{
  --bg:#211A14; --card:#2C2318; --ink:#F0E6DA; --muted:#A08E7C;
  --hair:#3E3226; --plum:#C9A97D; --plum-soft:#3A2E22; --sage:#8FA189;
  --amber:#D8AF72; --red:#D98A6E; --mark-x:#544539;
  --blk1:#4B3B2C; --blk2:#5C4632; --blk3:#6E5238; --blk4:#7F5E3E; --blk5:#8F6B47; --blk6:#A67C53;
  --fx-color:#E08A4D;
}
html[data-season="winter"]{
  --bg:#EEF3F6; --card:#FFFFFF; --ink:#28343D; --muted:#8A9AA6;
  --hair:#DCE6EC; --plum:#3E7EA8; --plum-soft:#DCEBF3; --sage:#96A68C;
  --amber:#7C93A8; --red:#B0614E; --mark-x:#C9D6DE;
  --blk1:#E8F1F6; --blk2:#D3E6EF; --blk3:#B9D8E6; --blk4:#98C2D8; --blk5:#6FA6C4; --blk6:#4A82A5;
  --fx-color:#BFE0F0;
}
html[data-season="winter"][data-theme="dark"]{
  --bg:#141C22; --card:#1D2932; --ink:#E7EEF2; --muted:#8FA3B0;
  --hair:#2C3A44; --plum:#6FB4DE; --plum-soft:#22323C; --sage:#8FA189;
  --amber:#8FB0C4; --red:#D68974; --mark-x:#33454F;
  --blk1:#1E2C34; --blk2:#243C48; --blk3:#2C4C5C; --blk4:#356074; --blk5:#40768C; --blk6:#4E8CA6;
  --fx-color:#8FCDE8;
}
html[data-season="spring"]{
  --bg:#F3F6EE; --card:#FFFFFF; --ink:#2E3B27; --muted:#8FA084;
  --hair:#E1EAD8; --plum:#7C9A5C; --plum-soft:#E7F0DC; --sage:#96A68C;
  --amber:#B79A4E; --red:#C1707E; --mark-x:#D3E0C6;
  --blk1:#EFF5E7; --blk2:#DEEBD0; --blk3:#C9DFB4; --blk4:#AFCF95; --blk5:#8FB86F; --blk6:#6E9C4E;
  --fx-color:#E3A6B8;
}
html[data-season="spring"][data-theme="dark"]{
  --bg:#161C13; --card:#212B1B; --ink:#E7EFDF; --muted:#93A686;
  --hair:#2E3A26; --plum:#9CC17A; --plum-soft:#28331F; --sage:#8FA189;
  --amber:#C2B06C; --red:#D68FA0; --mark-x:#3A4830;
  --blk1:#212B1B; --blk2:#293523; --blk3:#33422A; --blk4:#3E5033; --blk5:#4C623E; --blk6:#5D774C;
  --fx-color:#E9AFC1;
}
html[data-season="summer"]{
  --bg:#EAF6F3; --card:#FFFFFF; --ink:#1F3B36; --muted:#7FA69C;
  --hair:#D3ECE5; --plum:#2E9C86; --plum-soft:#DBF0EA; --sage:#96A68C;
  --amber:#D9A441; --red:#C1614A; --mark-x:#C3E4DB;
  --blk1:#E1F5EF; --blk2:#C7ECE0; --blk3:#A6DECE; --blk4:#7FCBB6; --blk5:#54B49B; --blk6:#379880;
  --fx-color:#E3C05C;
}
html[data-season="summer"][data-theme="dark"]{
  --bg:#0F211D; --card:#17302A; --ink:#DFF3EE; --muted:#7FAFA2;
  --hair:#254740; --plum:#4FC3A8; --plum-soft:#1C332C; --sage:#8FA189;
  --amber:#E0BD6F; --red:#D9836C; --mark-x:#2C4A42;
  --blk1:#17302A; --blk2:#1D3C34; --blk3:#25493F; --blk4:#2E584B; --blk5:#38695A; --blk6:#447D6B;
  --fx-color:#E9CE7E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
*{transition:background-color .2s ease,border-color .2s ease,color .2s ease,
  transform .12s ease,opacity .12s ease;}
button:active{opacity:.68;}
button.mcard:active,button.day:active,button.cell:active,button.wd:active,
button.chip:active,.flight:active,.submit:active{transform:scale(.96);opacity:1;}
.switch:active,.mark:active{transform:none;opacity:1;}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left;}
input,textarea,select{font:inherit;color:inherit;background:none;border:0;}
:focus-visible{outline:2px solid var(--plum);outline-offset:3px;border-radius:2px;}

.topbar{position:sticky;top:0;z-index:6;background:var(--bg);
  padding:calc(16px + env(safe-area-inset-top)) 20px 0;max-width:620px;margin:0 auto;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;}
.tabs{display:flex;gap:20px;}
.tab{padding:6px 0 10px;color:var(--muted);border-bottom:2px solid transparent;font-size:15px;}
.tab.active{color:var(--ink);border-bottom-color:var(--plum);}
.reset-link{color:var(--muted);font-size:11px;text-decoration:underline;text-underline-offset:2px;
  padding:6px 0 2px;display:inline-block;}

.switch{width:42px;height:24px;border-radius:14px;background:var(--hair);position:relative;flex:none;
  transition:background .2s;}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .2s;
  display:flex;align-items:center;justify-content:center;font-size:11px;}
html[data-theme="dark"] .switch{background:var(--plum);}
html[data-theme="dark"] .switch .knob{transform:translateX(18px);}

.wrap{max-width:620px;margin:0 auto;padding:18px 20px calc(64px + env(safe-area-inset-bottom));}

.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
.crumb{display:flex;align-items:baseline;gap:12px;}
.back{color:var(--muted);font-size:15px;}
.year-num{font-family:Georgia,"Times New Roman",serif;font-size:40px;line-height:1;}
.title{font-family:Georgia,"Times New Roman",serif;font-size:32px;font-weight:400;line-height:1;margin:0;}
.pick{display:flex;align-items:baseline;gap:10px;}
.step{color:var(--muted);font-size:20px;padding:0 4px;}
.saved{font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s;}
.saved.on{opacity:1;}

.sec{margin:0 0 32px;}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-bottom:8px;border-bottom:1px solid var(--hair);margin-bottom:12px;}
.sec-t{font-size:14px;color:var(--muted);}
.sec-n{font-size:13px;color:var(--muted);font-family:Georgia,serif;}
.sec-a{font-size:13px;color:var(--plum);}

.row{display:flex;align-items:flex-start;gap:12px;padding:8px 0;}
.mark{width:18px;height:18px;flex:none;margin-top:3px;border:1px solid var(--mark-x);border-radius:50%;
  transition:background .15s,border-color .15s;}
.mark.on{background:var(--plum);border-color:var(--plum);}
.mark.on::after{content:"";display:block;width:5px;height:9px;margin:2px auto 0;
  border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(42deg);}
.mark.sm{width:14px;height:14px;margin-top:4px;}
.mark.sm.on::after{width:4px;height:7px;margin-top:1px;}
.row-t{flex:1;min-width:0;word-break:break-word;}
.row.done>.row-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--mark-x);}
.sub-n{color:var(--muted);font-size:12px;font-family:Georgia,serif;margin-left:8px;}
.del{color:var(--mark-x);font-size:17px;padding:0 2px;flex:none;}
.steps{margin:2px 0 6px 30px;padding-left:14px;border-left:1px solid var(--hair);}
.steps .row{padding:5px 0;font-size:15px;}

.add{display:flex;align-items:center;gap:12px;padding:8px 0;}
.add input{flex:1;border-bottom:1px solid var(--hair);padding:3px 0;min-width:0;}
.add input::placeholder{color:var(--muted);opacity:.6;}
.add .dot{width:18px;height:18px;flex:none;border:1px dashed var(--mark-x);border-radius:50%;}
.add.sm{margin-left:0;}
.add.sm .dot{width:14px;height:14px;}

.months{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair);}
.mcard{background:var(--card);padding:13px 13px 11px;min-height:76px;
  display:flex;flex-direction:column;justify-content:space-between;}
.mcard.now{background:var(--plum-soft);}
.mname{font-family:Georgia,serif;font-size:19px;}
.mcard.now .mname{color:var(--plum);}
.mmeta{color:var(--muted);font-size:12px;margin-top:6px;}
.bar{height:2px;background:var(--hair);margin-top:7px;}
.bar i{display:block;height:2px;background:var(--plum);}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
.cal .dw{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px;}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:4px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-size:14px;
  font-family:Georgia,serif;gap:2px;color:var(--ink);}
.day.pad{visibility:hidden;}
.day.today{border-color:var(--plum);color:var(--plum);}
.day.sel{background:var(--plum);color:#fff;}
.day.past{color:var(--muted);}
.day i{width:4px;height:4px;border-radius:50%;background:var(--plum);display:block;}
.day.sel i{background:#fff;}

.evt{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair);}
.evt-d{font-family:Georgia,serif;font-size:16px;color:var(--plum);min-width:60px;flex:none;}
.evt-t{flex:1;}
.evt-y{color:var(--muted);font-size:11px;}
.ev-form{display:flex;gap:10px;align-items:center;padding:10px 0;flex-wrap:wrap;}
.ev-form input{flex:1;border-bottom:1px solid var(--hair);padding:4px 0;min-width:120px;}
.ev-day{font-family:Georgia,serif;color:var(--plum);font-size:15px;}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
.chk .box{width:14px;height:14px;border:1px solid var(--mark-x);border-radius:3px;}
.chk .box.on{background:var(--plum);border-color:var(--plum);}

.habit{margin-bottom:24px;}
.habit-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;}
.habit-n{font-size:15px;}
.habit-s{font-size:12px;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:290px;}
.cell{aspect-ratio:1;border:1px solid var(--hair);border-radius:3px;font-size:10px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.cell.pad{border:0;}
.cell.on{background:var(--plum);border-color:var(--plum);color:transparent;}
.cell.today{border-color:var(--plum);}
.cell.future{opacity:.45;}

.ybars{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:6px;}
.ybars span{flex:1;background:var(--plum-soft);position:relative;}
.ybars span i{position:absolute;bottom:0;left:0;right:0;background:var(--plum);}
.ylabels{display:flex;gap:3px;margin-top:3px;}
.ylabels span{flex:1;text-align:center;font-size:9px;color:var(--muted);}

.sum{font-size:14px;color:var(--muted);line-height:1.8;}
.search{width:100%;border-bottom:1px solid var(--hair);padding:6px 0 8px;font-family:Georgia,serif;font-size:17px;}
.res{padding:8px 0;border-bottom:1px solid var(--hair);}
.res b{font-weight:400;color:var(--plum);font-size:13px;font-family:Georgia,serif;}
.res p{margin:2px 0 0;font-size:15px;}

.link{color:var(--plum);font-size:14px;text-decoration:underline;text-underline-offset:3px;}
.tools{display:flex;flex-wrap:wrap;gap:16px;padding-top:8px;border-top:1px solid var(--hair);}
.restore{width:100%;margin-top:10px;}
.restore textarea{width:100%;height:76px;border:1px solid var(--hair);border-radius:4px;padding:8px;
  font-size:13px;resize:vertical;background:var(--card);color:var(--ink);}
.restore-row{display:flex;gap:14px;margin-top:8px;}
.empty{color:var(--muted);font-size:14px;padding:4px 0 8px;}
.empty-fx{text-align:center;padding:22px 0 14px;}
.empty-fx svg{color:var(--mark-x);margin-bottom:8px;}
.empty-fx .empty{padding:0;}
.note{width:100%;border:1px solid var(--hair);border-radius:4px;padding:10px;font-size:15px;
  min-height:70px;resize:vertical;font-family:Georgia,serif;line-height:1.6;background:var(--card);color:var(--ink);}

/* --- рейсы --- */
.flight{background:var(--card);border:1px solid var(--hair);border-radius:10px;
  padding:18px 18px 14px;margin-bottom:16px;}
.flight.past{opacity:.5;}
.f-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.f-num{font-family:Georgia,serif;font-size:22px;}
.f-route{color:var(--muted);font-size:13px;margin-top:2px;}
.f-del{color:var(--mark-x);font-size:19px;padding:2px;}
.f-when{margin-top:12px;font-size:14px;color:var(--muted);}
.f-when b{color:var(--ink);font-weight:400;}
.stage{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);}
.stage-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--hair);}
.stage-dot.active{background:var(--plum);}
.stage-dot.done{background:var(--mark-x);}
.stage-txt{flex:1;font-size:14px;}
.stage-time{font-family:Georgia,serif;font-size:14px;color:var(--muted);}
.big{margin-top:14px;padding:14px 0 2px;text-align:center;}
.big-label{font-size:13px;color:var(--muted);}
.big-time{font-family:Georgia,serif;font-size:34px;margin-top:2px;}
.big-time.warn{color:var(--amber);}
.big-time.urgent{color:var(--red);}
.big-time.now{color:var(--plum);}
.actions{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);}
.form{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:18px;margin-bottom:20px;}
.frow{display:flex;gap:12px;margin-bottom:12px;}
.frow.wrap2{flex-wrap:wrap;}
.field{flex:1;min-width:0;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.field input{width:100%;border-bottom:1px solid var(--hair);padding:6px 0;font-size:16px;}
.field input:focus{border-bottom-color:var(--plum);}
.field.sm{flex:0 0 84px;}
.margins{display:flex;gap:12px;margin-bottom:4px;}
.mfield{flex:1;}
.mfield label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.mfield input{width:100%;border-bottom:1px solid var(--hair);padding:6px 0;font-size:15px;}
.submit{margin-top:14px;background:var(--plum);color:#fff;border-radius:8px;padding:11px;
  text-align:center;font-size:15px;}
.toggle-form{color:var(--plum);font-size:15px;margin-bottom:20px;display:inline-block;}
.alarms{width:100%;margin-top:8px;padding:12px;background:var(--plum-soft);border-radius:8px;
  font-family:Georgia,serif;font-size:14px;line-height:1.9;white-space:pre-wrap;color:var(--ink);}

/* --- неделя --- */
.wk-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.wk-range{font-family:Georgia,"Times New Roman",serif;font-size:26px;}
.wk-nav{display:flex;align-items:center;gap:10px;}
.wk-toggle{color:var(--plum);font-size:14px;margin-bottom:14px;display:inline-block;}

.wk-add{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:16px;margin-bottom:18px;}
.wk-daypick{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.wk-daybtn{flex:1;min-width:38px;text-align:center;padding:8px 4px;border:1px solid var(--hair);
  border-radius:8px;font-size:12px;color:var(--muted);}
.wk-daybtn .n{display:block;font-family:Georgia,serif;font-size:15px;color:var(--ink);margin-top:2px;}
.wk-daybtn.sel{background:var(--plum);border-color:var(--plum);color:#fff;}
.wk-daybtn.sel .n{color:#fff;}

.wk-grid{position:relative;display:grid;grid-template-columns:32px repeat(7,1fr);
  border-top:1px solid var(--hair);border-left:1px solid var(--hair);margin-bottom:6px;}
.wk-dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;
  border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);grid-row:1;}
.wk-dow.weekend{color:var(--red);}
.wk-cell.weekend{background:var(--plum-soft);}
.wk-corner{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);grid-row:1;}
.wk-hourlabel{font-size:9px;color:var(--muted);text-align:right;padding-right:4px;
  border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  display:flex;align-items:flex-start;justify-content:flex-end;transform:translateY(-5px);}
.wk-cell{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);}
.wk-block{border-radius:4px;padding:2px 4px;font-size:9.5px;line-height:1.25;overflow:hidden;
  color:var(--ink);margin:0 1px;box-shadow:0 0 0 1px rgba(0,0,0,.04) inset;}
.wk-block b{display:block;font-weight:600;font-size:9.5px;}
.wk-block.sel{outline:2px solid var(--ink);outline-offset:-2px;}

.wk-detail{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-bottom:18px;}
.wk-detail-t{font-size:16px;margin-bottom:4px;}
.wk-detail-m{font-size:13px;color:var(--muted);margin-bottom:10px;}

.wk-legend{margin-top:6px;}
.wk-leg-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;}
.wk-swatch{width:12px;height:12px;border-radius:3px;flex:none;}
.wk-leg-hex{color:var(--muted);font-family:Georgia,serif;font-size:12px;margin-left:auto;}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}

#seasonFX{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.fx{position:absolute;top:-10vh;will-change:transform;}
.fx-leaf{border-radius:0 100% 0 100%;background:var(--fx-color);opacity:.45;}
.fx-snow{border-radius:50%;background:var(--fx-color);opacity:.6;}
@keyframes fxFall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  50%{transform:translate(var(--sway),50vh) rotate(180deg);}
  100%{transform:translate(0,110vh) rotate(360deg);}
}
@keyframes fxRise{
  0%{transform:translate(0,110vh) rotate(0deg);opacity:0;}
  10%{opacity:.55;}
  90%{opacity:.55;}
  100%{transform:translate(var(--sway),-10vh) rotate(180deg);opacity:0;}
}
.season-btn{color:var(--muted);font-size:12px;padding:6px 8px;border:1px solid var(--hair);
  border-radius:12px;margin-right:8px;}
@media (prefers-reduced-motion:reduce){.fx{animation:none!important;display:none;}}
</style>
</head>
<body>
<div id="seasonFX" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-row">
    <nav class="tabs">
      <button class="tab active" data-tab="planner">Планер</button>
      <button class="tab" data-tab="week">Неделя</button>
      <button class="tab" data-tab="flights">Рейсы</button>
    </nav>
    <div style="display:flex;align-items:center">
      <button class="season-btn" id="seasonBtn">осень</button>
      <button class="switch" id="themeSwitch" aria-label="Переключить тему"><span class="knob">☀</span></button>
    </div>
  </div>
  <button class="reset-link" id="hardReset">обновить принудительно</button>
</header>
<div class="wrap" id="content"></div>

<script>
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsP(n){return String(n).padStart(2,"0");}
function icsDT(d){return d.getFullYear()+icsP(d.getMonth()+1)+icsP(d.getDate())+"T"+icsP(d.getHours())+icsP(d.getMinutes())+"00";}
function icsUID(){return "x"+Date.now()+Math.random().toString(36).slice(2,8)+"@planner.local";}
function buildICS(events){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planner//RU","CALSCALE:GREGORIAN"];
  events.forEach(function(e){
    L.push("BEGIN:VEVENT");
    L.push("UID:"+icsUID());
    L.push("DTSTAMP:"+icsDT(new Date()));
    L.push("DTSTART:"+icsDT(e.start));
    L.push("DTEND:"+icsDT(e.end||new Date(e.start.getTime()+30*60000)));
    L.push("SUMMARY:"+icsEsc(e.title));
    if(e.description)L.push("DESCRIPTION:"+icsEsc(e.description));
    if(e.rrule)L.push("RRULE:"+e.rrule);
    (e.alarms||[]).forEach(function(a){
      L.push("BEGIN:VALARM");
      L.push("ACTION:DISPLAY");
      L.push("DESCRIPTION:"+icsEsc(a.desc||e.title));
      L.push("TRIGGER:-PT"+a.minutesBefore+"M");
      L.push("END:VALARM");
    });
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function downloadICS(filename,events){
  if(!events.length){toastGlobal("Нечего добавлять в календарь");return;}
  var blob=new Blob([buildICS(events)],{type:"text/calendar;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.rel="noopener";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
function toastGlobal(msg){
  var t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove();},1800);
}

var Planner=(function(){

var MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
var MSHORT=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var DOW=["пн","вт","ср","чт","пт","сб","вс"];
var KEY="planner:v1";

var now=new Date();
var view="year",year=now.getFullYear(),month=now.getMonth(),selDay=0,openGoal="",query="";
var D=load(),saveTimer=null;

function load(){
  try{var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);
      return {yearGoals:o.yearGoals||{},months:o.months||{},habits:o.habits||[],
              marks:o.marks||{},annual:o.annual||[]};}
  }catch(e){}
  return {yearGoals:{},months:{},habits:[],marks:{},annual:[]};
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify(D));
      var s=document.querySelector(".saved");
      if(s){s.classList.add("on");setTimeout(function(){s.classList.remove("on");},1300);}
    }catch(e){toast("Не удалось сохранить");}
  },350);
}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function p2(n){return String(n).padStart(2,"0");}
function key(y,m){return y+"-"+p2(m+1);}
function dkey(y,m,d){return y+"-"+p2(m+1)+"-"+p2(d);}
function daysIn(y,m){return new Date(y,m+1,0).getDate();}
function firstDow(y,m){return (new Date(y,m,1).getDay()+6)%7;}
function today0(){var n=new Date();n.setHours(0,0,0,0);return n;}
function isToday(y,m,d){var n=new Date();return y===n.getFullYear()&&m===n.getMonth()&&d===n.getDate();}
function isPast(y,m,d){return new Date(y,m,d)<today0();}
function mo(y,m){var k=key(y,m);if(!D.months[k])D.months[k]={goals:[],events:[],note:""};
  var x=D.months[k];if(!x.goals)x.goals=[];if(!x.events)x.events=[];if(x.note==null)x.note="";return x;}
function yg(y){if(!D.yearGoals[y])D.yearGoals[y]=[];return D.yearGoals[y];}
function eventsOf(y,m){
  var list=mo(y,m).events.map(function(e){return {id:e.id,day:e.day,text:e.text,time:e.time||"",yearly:false};});
  D.annual.forEach(function(a){if(a.month===m)list.push({id:a.id,day:a.day,text:a.text,time:a.time||"",yearly:true});});
  return list.sort(function(a,b){return a.day-b.day||(a.time||"").localeCompare(b.time||"");});
}
function plural(n,a,b,c){var x=n%100;if(x>4&&x<21)return c;x=n%10;return x===1?a:(x>1&&x<5?b:c);}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove();},1800);}
function copyText(text){
  var done=function(ok){toast(ok?"Скопировано":"Скопировать не вышло");};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(function(){done(true);},fb);else fb();
  function fb(){try{var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";
    ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    var ok=document.execCommand("copy");document.body.removeChild(ta);done(ok);}catch(e){done(false);}}
}
var app=document.getElementById("content");
function render(){view==="year"?renderYear():renderMonth();}

/* ─── цели с подшагами ─── */
function goalRows(list,ph,tag){
  var h="";
  list.forEach(function(g){
    if(!g.steps)g.steps=[];
    var sd=g.steps.filter(function(s){return s.done;}).length;
    h+='<div class="row'+(g.done?" done":"")+'"><button class="mark'+(g.done?" on":"")+
       '" data-t="'+tag+":"+g.id+'" aria-label="Отметить"></button>'+
       '<button class="row-t" data-open="'+g.id+'">'+esc(g.text)+
       (g.steps.length?'<span class="sub-n">'+sd+"/"+g.steps.length+'</span>':"")+'</button>'+
       '<button class="del" data-d="'+tag+":"+g.id+'" aria-label="Удалить">×</button></div>';
    if(openGoal===g.id){
      h+='<div class="steps">';
      g.steps.forEach(function(s){
        h+='<div class="row'+(s.done?" done":"")+'"><button class="mark sm'+(s.done?" on":"")+
           '" data-st="'+tag+":"+g.id+":"+s.id+'" aria-label="Отметить"></button>'+
           '<span class="row-t">'+esc(s.text)+'</span>'+
           '<button class="del" data-sd="'+tag+":"+g.id+":"+s.id+'" aria-label="Удалить">×</button></div>';
      });
      h+='<div class="add sm"><span class="dot"></span><input data-sn="'+tag+":"+g.id+'" placeholder="шаг">'+
         '<button class="link" data-snbtn="'+tag+":"+g.id+'" style="flex:0 0 auto">добавить</button></div></div>';
    }
  });
  h+='<div class="add"><span class="dot"></span><input data-n="'+tag+'" placeholder="'+ph+'">'+
     '<button class="link" data-nbtn="'+tag+'" style="flex:0 0 auto">добавить</button></div>';
  return h;
}
function findList(tag){return tag==="y"?yg(year):mo(year,month).goals;}
function bindGoals(){
  app.querySelectorAll("[data-t]").forEach(function(b){
    b.onclick=function(){var a=b.dataset.t.split(":"),l=findList(a[0]);
      l.forEach(function(g){if(g.id===a[1])g.done=!g.done;});save();render();};
  });
  app.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick=function(){openGoal=openGoal===b.dataset.open?"":b.dataset.open;render();};
  });
  app.querySelectorAll("[data-d]").forEach(function(b){
    b.onclick=function(){var a=b.dataset.d.split(":"),l=findList(a[0]);
      var i=l.map(function(g){return g.id;}).indexOf(a[1]);
      if(i>=0)l.splice(i,1);save();render();};
  });
  app.querySelectorAll("[data-st]").forEach(function(b){
    b.onclick=function(){var a=b.dataset.st.split(":"),l=findList(a[0]);
      l.forEach(function(g){if(g.id===a[1])g.steps.forEach(function(s){if(s.id===a[2])s.done=!s.done;});});
      save();render();};
  });
  app.querySelectorAll("[data-sd]").forEach(function(b){
    b.onclick=function(){var a=b.dataset.sd.split(":"),l=findList(a[0]);
      l.forEach(function(g){if(g.id===a[1])g.steps=g.steps.filter(function(s){return s.id!==a[2];});});
      save();render();};
  });
  app.querySelectorAll("[data-sn]").forEach(function(i){
    function addStep(){
      if(!i.value.trim())return;
      var a=i.dataset.sn.split(":"),l=findList(a[0]);
      l.forEach(function(g){if(g.id===a[1])g.steps.push({id:uid(),text:i.value.trim(),done:false});});
      save();render();
    }
    i.onkeydown=function(e){if(e.key==="Enter")addStep();};
    var btn=app.querySelector('[data-snbtn="'+i.dataset.sn+'"]');
    if(btn)btn.onclick=addStep;
  });
  app.querySelectorAll("[data-n]").forEach(function(i){
    function addGoal(){
      if(!i.value.trim())return;
      findList(i.dataset.n).push({id:uid(),text:i.value.trim(),done:false,steps:[]});save();render();
    }
    i.onkeydown=function(e){if(e.key==="Enter")addGoal();};
    var btn=app.querySelector('[data-nbtn="'+i.dataset.n+'"]');
    if(btn)btn.onclick=addGoal;
  });
}

/* ─── привычки: расчёты ─── */
function habitStats(hb,y,m){
  var marks=D.marks[hb.id]||{},n=daysIn(y,m),cnt=0;
  for(var d=1;d<=n;d++)if(marks[dkey(y,m,d)])cnt++;
  var probe=today0();
  if(!marks[dkey(probe.getFullYear(),probe.getMonth(),probe.getDate())])probe.setDate(probe.getDate()-1);
  var streak=0;
  while(marks[dkey(probe.getFullYear(),probe.getMonth(),probe.getDate())]){streak++;probe.setDate(probe.getDate()-1);}
  return {count:cnt,days:n,streak:streak};
}
function streakAt(marks,y,m,d){
  var probe=new Date(y,m,d),count=0,guard=0;
  while(marks[dkey(probe.getFullYear(),probe.getMonth(),probe.getDate())]&&guard<60){
    count++;guard++;probe.setDate(probe.getDate()-1);
  }
  return count;
}
function habitYear(hb,y){
  var marks=D.marks[hb.id]||{},out=[],total=0;
  for(var m=0;m<12;m++){var n=daysIn(y,m),c=0;
    for(var d=1;d<=n;d++)if(marks[dkey(y,m,d)])c++;
    out.push(Math.round(c/n*100));total+=c;}
  return {bars:out,total:total};
}

/* ─── ближайшие даты ─── */
function upcoming(limit){
  var t=today0(),out=[];
  for(var i=0;i<14;i++){
    var d=new Date(t.getFullYear(),t.getMonth()+i,1),y=d.getFullYear(),m=d.getMonth();
    eventsOf(y,m).forEach(function(e){
      var dt=new Date(y,m,e.day);
      if(dt>=t)out.push({date:dt,text:e.text,time:e.time,yearly:e.yearly,
        days:Math.round((dt-t)/86400000)});
    });
    if(out.length>=limit*3)break;
  }
  out.sort(function(a,b){return a.date-b.date;});
  return out.slice(0,limit);
}
function whenLabel(n){
  if(n===0)return "сегодня";
  if(n===1)return "завтра";
  if(n===2)return "послезавтра";
  if(n<30)return "через "+n+" "+plural(n,"день","дня","дней");
  var mth=Math.round(n/30);return "через "+mth+" "+plural(mth,"месяц","месяца","месяцев");
}

/* ─── год ─── */
function renderYear(){
  var goals=yg(year),h="";
  h+='<div class="head"><div class="pick"><button class="step" id="yprev">‹</button>'+
     '<span class="year-num">'+year+'</span><button class="step" id="ynext">›</button></div>'+
     '<span class="saved">сохранено</span></div>';

  var up=upcoming(3);
  if(up.length){
    h+='<section class="sec"><div class="sec-h"><span class="sec-t">ближайшее</span></div>';
    up.forEach(function(e){
      h+='<div class="evt"><span class="evt-d">'+e.date.getDate()+" "+MSHORT[e.date.getMonth()]+
         (e.time?", "+e.time:"")+'</span>'+
         '<span class="evt-t">'+esc(e.text)+(e.yearly?' <span class="evt-y">каждый год</span>':"")+'</span>'+
         '<span class="evt-y">'+whenLabel(e.days)+'</span></div>';
    });
    h+='</section>';
  }

  var dn=goals.filter(function(g){return g.done;}).length;
  h+='<section class="sec"><div class="sec-h"><span class="sec-t">планы на год</span>'+
     '<span class="sec-n">'+(goals.length?dn+" / "+goals.length:"")+'</span></div>'+
     goalRows(goals,"что важно за год","y")+'</section>';

  h+='<section class="sec"><div class="sec-h"><span class="sec-t">месяцы</span></div><div class="months">';
  for(var m=0;m<12;m++){
    var d=D.months[key(year,m)]||{goals:[],events:[]};
    var tot=(d.goals||[]).length,done=(d.goals||[]).filter(function(g){return g.done;}).length;
    var ev=eventsOf(year,m).length,meta=[];
    if(tot)meta.push(done+" из "+tot);
    if(ev)meta.push(ev+" "+plural(ev,"дата","даты","дат"));
    h+='<button class="mcard'+(year===now.getFullYear()&&m===now.getMonth()?" now":"")+'" data-m="'+m+'">'+
       '<span class="mname">'+MONTHS[m]+'</span><span class="mmeta">'+(meta.join(" · ")||"—")+'</span>'+
       (tot?'<span class="bar"><i style="width:'+Math.round(done/tot*100)+'%"></i></span>':"")+'</button>';
  }
  h+='</div></section>';

  if(D.habits.length){
    h+='<section class="sec"><div class="sec-h"><span class="sec-t">привычки за год</span></div>';
    D.habits.forEach(function(hb){
      var s=habitYear(hb,year);
      h+='<div class="habit"><div class="habit-h"><span class="habit-n">'+esc(hb.name)+'</span>'+
         '<span class="habit-s">'+s.total+" "+plural(s.total,"день","дня","дней")+'</span></div><div class="ybars">';
      s.bars.forEach(function(v){h+='<span><i style="height:'+v+'%"></i></span>';});
      h+='</div><div class="ylabels">';
      MSHORT.forEach(function(x){h+='<span>'+x[0]+'</span>';});
      h+='</div></div>';
    });
    h+='</section>';
  }

  h+='<section class="sec"><div class="sec-h"><span class="sec-t">поиск</span></div>'+
     '<input class="search" id="q" value="'+esc(query)+'" placeholder="цель, дата, шаг"><div id="res"></div></section>';

  h+='<div class="tools"><button class="link" id="exp">Скопировать данные</button>'+
     '<button class="link" id="imp">Восстановить из копии</button><div id="impBox" class="restore"></div></div>';
  app.innerHTML=h;

  document.getElementById("yprev").onclick=function(){year--;openGoal="";render();};
  document.getElementById("ynext").onclick=function(){year++;openGoal="";render();};
  app.querySelectorAll("[data-m]").forEach(function(b){
    b.onclick=function(){month=+b.dataset.m;selDay=0;openGoal="";view="month";render();window.scrollTo(0,0);};
  });
  bindGoals();
  var q=document.getElementById("q");
  q.oninput=function(){query=q.value;showRes();};
  showRes();
  document.getElementById("exp").onclick=function(){copyText(JSON.stringify(D));};
  document.getElementById("imp").onclick=function(){
    var box=document.getElementById("impBox");
    box.innerHTML='<textarea id="impT" placeholder="Вставьте сюда скопированные данные"></textarea>'+
      '<div class="restore-row"><button class="link" id="impGo">Восстановить</button>'+
      '<button class="link" id="impNo">Отмена</button></div>';
    document.getElementById("impNo").onclick=function(){box.innerHTML="";};
    document.getElementById("impGo").onclick=function(){
      try{var o=JSON.parse(document.getElementById("impT").value);
        if(!o||typeof o!=="object")throw 0;
        D={yearGoals:o.yearGoals||{},months:o.months||{},habits:o.habits||[],
           marks:o.marks||{},annual:o.annual||[]};
        save();render();toast("Данные восстановлены");
      }catch(e){toast("Это не похоже на копию данных");}
    };
  };
}
function showRes(){
  var box=document.getElementById("res");if(!box)return;
  var q=query.trim().toLowerCase();
  if(q.length<2){box.innerHTML="";return;}
  var out=[];
  Object.keys(D.yearGoals).forEach(function(y){
    D.yearGoals[y].forEach(function(g){
      if(g.text.toLowerCase().indexOf(q)>=0)out.push({where:y+" · план года",text:g.text});
      (g.steps||[]).forEach(function(s){
        if(s.text.toLowerCase().indexOf(q)>=0)out.push({where:y+" · шаг",text:s.text});});
    });
  });
  Object.keys(D.months).forEach(function(k){
    var a=k.split("-"),lbl=MONTHS[+a[1]-1]+" "+a[0];
    (D.months[k].goals||[]).forEach(function(g){
      if(g.text.toLowerCase().indexOf(q)>=0)out.push({where:lbl+" · цель",text:g.text});
      (g.steps||[]).forEach(function(s){
        if(s.text.toLowerCase().indexOf(q)>=0)out.push({where:lbl+" · шаг",text:s.text});});
    });
    (D.months[k].events||[]).forEach(function(e){
      if(e.text.toLowerCase().indexOf(q)>=0)out.push({where:lbl+" · "+e.day+" число",text:e.text});});
  });
  D.annual.forEach(function(a){
    if(a.text.toLowerCase().indexOf(q)>=0)out.push({where:a.day+" "+MSHORT[a.month]+" · каждый год",text:a.text});});
  box.innerHTML=out.length?out.slice(0,20).map(function(r){
    return '<div class="res"><b>'+esc(r.where)+'</b><p>'+esc(r.text)+'</p></div>';}).join("")
    :'<p class="empty">Ничего не нашлось.</p>';
}

/* ─── месяц ─── */
function renderMonth(){
  var m=mo(year,month),n=daysIn(year,month),evs=eventsOf(year,month),h="";
  h+='<div class="head"><div class="crumb"><button class="back" id="back">'+year+'</button>'+
     '<button class="step" id="mprev">‹</button><h1 class="title">'+MONTHS[month]+'</h1>'+
     '<button class="step" id="mnext">›</button></div><span class="saved">сохранено</span></div>';

  /* календарь */
  h+='<section class="sec"><div class="cal">';
  DOW.forEach(function(d){h+='<span class="dw">'+d+'</span>';});
  for(var i=0;i<firstDow(year,month);i++)h+='<span class="day pad"></span>';
  for(var d1=1;d1<=n;d1++){
    var has=evs.some(function(e){return e.day===d1;});
    h+='<button class="day'+(isToday(year,month,d1)?" today":"")+(selDay===d1?" sel":"")+
       (isPast(year,month,d1)?" past":"")+'" data-day="'+d1+'">'+d1+(has?'<i></i>':"")+'</button>';
  }
  h+='</div>';

  h+='<div class="sec-h"><span class="sec-t">важные даты</span>'+
     (evs.length?'<button class="sec-a" id="icsMonth">в календарь</button>':"")+
     '<span class="sec-n">'+(evs.length||"")+'</span></div>';
  if(!evs.length)h+=emptyBlock("Тапните по числу, чтобы добавить.");
  evs.forEach(function(e){
    h+='<div class="evt"><span class="evt-d">'+e.day+" "+MSHORT[month]+(e.time?", "+e.time:"")+'</span>'+
       '<span class="evt-t">'+esc(e.text)+(e.yearly?' <span class="evt-y">каждый год</span>':"")+'</span>'+
       '<button class="del" data-ed="'+(e.yearly?"a:":"m:")+e.id+'" aria-label="Удалить">×</button></div>';
  });
  if(selDay){
    h+='<div class="ev-form"><span class="ev-day">'+selDay+" "+MSHORT[month]+'</span>'+
       '<input id="evText" placeholder="что за день" autofocus>'+
       '<input id="evTime" type="time" style="flex:0 0 100px">'+
       '<button class="chk" id="evYear"><span class="box"></span>каждый год</button>'+
       '<button class="submit" id="evSave" style="flex:0 0 auto;padding:8px 16px">Сохранить</button></div>';
  }
  h+='</section>';

  var dn=m.goals.filter(function(g){return g.done;}).length;
  h+='<section class="sec"><div class="sec-h"><span class="sec-t">цели месяца</span>'+
     (dn<m.goals.length&&m.goals.length?'<button class="sec-a" id="carry">перенести в '+MONTHS[(month+1)%12]+'</button>':"")+
     '<span class="sec-n">'+(m.goals.length?dn+" / "+m.goals.length:"")+'</span></div>'+
     goalRows(m.goals,"цель на месяц","m")+'</section>';

  h+='<section class="sec"><div class="sec-h"><span class="sec-t">привычки</span></div>';
  if(!D.habits.length)h+=emptyBlock("Добавьте привычку — появится сетка на месяц.");
  D.habits.forEach(function(hb){
    var st=habitStats(hb,year,month),marks=D.marks[hb.id]||{};
    h+='<div class="habit"><div class="habit-h"><span class="habit-n">'+esc(hb.name)+'</span>'+
       '<span class="habit-s"><span class="hs">'+st.count+" из "+n+'</span>'+
       (st.streak>1?" · серия "+st.streak:"")+
       ' <button class="del" data-hd="'+hb.id+'" aria-label="Удалить привычку">×</button></span></div><div class="grid">';

var Reysy=(function(){

var KEY="reysy:v1";
var MONTHS=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var DOW=["вс","пн","вт","ср","чт","пт","сб"];
var D=load(),showForm=false,showRing=false,ringName="",ringLegs=[],saveTimer=null,tickTimer=null;

function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);
    return {flights:o.flights||[],trips:o.trips||[]};}}
  catch(e){}
  return {flights:[],trips:[]};
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify(D));
      var s=document.querySelector(".saved");
      if(s){s.classList.add("on");setTimeout(function(){s.classList.remove("on");},1300);}
    }catch(e){toast("Не удалось сохранить");}
  },300);
}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function p2(n){return String(n).padStart(2,"0");}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove();},1800);}
function copyText(text){
  var done=function(ok){toast(ok?"Скопировано":"Скопировать не вышло");};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(function(){done(true);},fb);else fb();
  function fb(){try{var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";
    ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    var ok=document.execCommand("copy");document.body.removeChild(ta);done(ok);}catch(e){done(false);}}
}

function dt(f){return new Date(f.date+"T"+f.time);}
function arrDt(f){return f.arrTime?new Date(f.date+"T"+f.arrTime):null;}
function fmtDate(d){return DOW[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()];}
function fmtTime(d){return p2(d.getHours())+":"+p2(d.getMinutes());}
function fmtDT(d){return fmtDate(d)+" в "+fmtTime(d);}
function addH(d,h){return new Date(d.getTime()+h*3600000);}
function fmtLeft(ms){
  if(ms<=0)return "уже пора";
  var totalMin=Math.round(ms/60000);
  var days=Math.floor(totalMin/1440),h=Math.floor((totalMin%1440)/60),m=totalMin%60;
  var parts=[];
  if(days)parts.push(days+" "+plural(days,"день","дня","дней"));
  if(h||days)parts.push(h+" ч");
  parts.push(m+" мин");
  return parts.join(" ");
}
function plural(n,a,b,c){var x=n%100;if(x>4&&x<21)return c;x=n%10;return x===1?a:(x>1&&x<5?b:c);}
function routeLabel(f){
  if(f.from||f.to)return (f.from||"?")+" → "+(f.to||"?");
  return f.route||"";
}

var app=document.getElementById("content");

function stagesOf(f){
  var dep=dt(f),checkin=addH(dep,-(f.checkinH||0)),pack=addH(checkin,-(f.packH||0));
  return {pack:pack,checkin:checkin,dep:dep};
}

function flightCardHTML(f,simple){
  var s=stagesOf(f),now=new Date(),isPast=now>s.dep;
  var h='<div class="flight'+(isPast?" past":"")+'" data-id="'+f.id+'">';
  h+='<div class="f-top"><div><div class="f-num">'+esc(f.number)+'</div>'+
     (routeLabel(f)?'<div class="f-route">'+esc(routeLabel(f))+'</div>':"")+'</div>'+
     '<button class="f-del" data-del="'+f.id+'" aria-label="Удалить">×</button></div>';

  var when='Вылет <b>'+fmtDT(s.dep)+'</b>';
  if(f.terminal)when+=', терминал <b>'+esc(f.terminal)+'</b>';
  if(f.arrTime)when+=', прибытие <b>'+esc(f.arrTime)+'</b>';
  h+='<div class="f-when">'+when+'</div>';

  if(!isPast){
    var next,label,cls="";
    if(simple){
      next=s.dep;label="до вылета";cls="urgent";
    } else if(now<s.pack){next=s.pack;label="до сборов";}
    else if(now<s.checkin){next=s.checkin;label="до явки в терминале";cls="warn";}
    else {next=s.dep;label="до вылета";cls="urgent";}
    var ms=next-now;
    if(ms<15*60000)cls="urgent";
    h+='<div class="big"><div class="big-label">'+label+'</div>'+
       '<div class="big-time '+cls+'">'+fmtLeft(ms)+'</div></div>';
  }

  if(!simple){
    h+='<div class="stage"><span class="stage-dot'+(now>=s.pack?" done":"")+'"></span>'+
       '<span class="stage-txt">Собираться</span><span class="stage-time">'+fmtTime(s.pack)+'</span></div>';
    h+='<div class="stage"><span class="stage-dot'+(now>=s.checkin?" done":"")+'"></span>'+
       '<span class="stage-txt">Быть в терминале</span><span class="stage-time">'+fmtTime(s.checkin)+'</span></div>';
  }
  h+='<div class="stage"><span class="stage-dot'+(now>=s.dep?" done":"")+'"></span>'+
     '<span class="stage-txt">Вылет</span><span class="stage-time">'+fmtTime(s.dep)+'</span></div>';

  h+='<div class="actions"><button class="link" data-alarm="'+f.id+'">будильники</button>'+
     '<button class="link" data-ics="'+f.id+'">в календарь</button></div>';
  h+='<div id="alarmBox-'+f.id+'"></div>';
  h+='</div>';
  return h;
}

function connectionHTML(prev,cur){
  var prevArr=arrDt(prev);
  if(prevArr){
    var mins=Math.round((dt(cur)-prevArr)/60000);
    var label=mins>=0?fmtLeft(mins*60000):"время пересадки не сходится";
    return '<div class="f-when" style="padding:6px 0 10px;color:var(--muted)">'+
      '⤷ пересадка'+(prev.to?" в "+esc(prev.to):"")+': <b>'+label+'</b></div>';
  }
  return '<div class="f-when" style="padding:2px 0 10px;color:var(--muted)">⤷ следующий рейс</div>';
}

function render(){
  var now=new Date();
  var standalone=D.flights.filter(function(f){return !f.tripId;});
  var byTrip={};
  D.flights.filter(function(f){return f.tripId;}).forEach(function(f){
    (byTrip[f.tripId]=byTrip[f.tripId]||[]).push(f);
  });
  Object.keys(byTrip).forEach(function(tid){
    byTrip[tid].sort(function(a,b){return (a.legIndex||0)-(b.legIndex||0);});
  });

  var blocks=standalone.map(function(f){return {t:"flight",key:dt(f),f:f};});
  D.trips.forEach(function(tr){
    var legs=byTrip[tr.id]||[];
    if(!legs.length)return;
    blocks.push({t:"trip",key:dt(legs[0]),trip:tr,legs:legs});
  });
  blocks.sort(function(a,b){return a.key-b.key;});

  var h='<div class="head"><h1 class="title">Рейсы</h1><span class="saved">сохранено</span></div>';

  h+='<div class="frow" style="gap:16px;margin-bottom:'+((showForm||showRing)?"0":"20px")+'">';
  h+= showForm ? "" : '<button class="toggle-form" id="openForm" style="margin:0">+ добавить рейс</button>';
  h+= showRing ? "" : '<button class="toggle-form" id="openRing" style="margin:0">+ добавить кольцо</button>';
  h+='</div>';
  if(showForm)h+=formHTML();
  if(showRing)h+=ringHTML();

  if(!blocks.length){
    h+=emptyBlock("Пока ни одного рейса. Добавьте — появится обратный отсчёт.");
  }

  blocks.forEach(function(b){
    if(b.t==="flight"){h+=flightCardHTML(b.f,false);return;}
    var legs=b.legs,first=dt(legs[0]),last=dt(legs[legs.length-1]);
    var range=first.getDate()===last.getDate()&&first.getMonth()===last.getMonth()
      ?fmtDate(first)
      :first.getDate()+" "+MONTHS[first.getMonth()]+" – "+last.getDate()+" "+MONTHS[last.getMonth()];
    h+='<div class="sec-h" style="margin-top:22px"><span class="sec-t">'+esc(b.trip.name||"кольцо")+
       '</span><span class="sec-n">'+legs.length+" "+plural(legs.length,"рейс","рейса","рейсов")+" · "+range+'</span></div>';
    h+='<button class="link" data-deltrip="'+b.trip.id+'" style="margin-bottom:10px">удалить кольцо целиком</button>';
    legs.forEach(function(leg,i){
      if(i>0)h+=connectionHTML(legs[i-1],leg);
      h+=flightCardHTML(leg, !(leg.checkinH||leg.packH));
    });
  });

  app.innerHTML=h;
  bindCommon();
  bindForm();
  bindRing();
  clearInterval(tickTimer);
  tickTimer=setInterval(render,60000);
}

function bindCommon(){
  var of=document.getElementById("openForm");
  if(of)of.onclick=function(){showForm=true;showRing=false;render();};
  var or_=document.getElementById("openRing");
  if(or_)or_.onclick=function(){
    showRing=true;showForm=false;
    ringName="";
    var d0=new Date().toISOString().slice(0,10);
    ringLegs=[blankLeg(d0),blankLeg(d0)];
    render();
  };

  app.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){D.flights=D.flights.filter(function(f){return f.id!==b.dataset.del;});save();render();};
  });
  app.querySelectorAll("[data-deltrip]").forEach(function(b){
    b.onclick=function(){
      if(!confirm("Удалить кольцо и все его рейсы?"))return;
      D.trips=D.trips.filter(function(t){return t.id!==b.dataset.deltrip;});
      D.flights=D.flights.filter(function(f){return f.tripId!==b.dataset.deltrip;});
      save();render();
    };
  });
  app.querySelectorAll("[data-alarm]").forEach(function(b){
    b.onclick=function(){
      var f=D.flights.filter(function(x){return x.id===b.dataset.alarm;})[0];if(!f)return;
      var s=stagesOf(f),box=document.getElementById("alarmBox-"+f.id);
      if(box.innerHTML){box.innerHTML="";return;}
      var text;
      if(f.checkinH||f.packH){
        text="Рейс "+f.number+"\nСобраться к "+fmtTime(s.pack)+" ("+fmtDate(s.pack)+")"+
          "\nВыйти / быть в терминале к "+fmtTime(s.checkin)+"\nВылет "+fmtTime(s.dep);
      } else {
        text="Рейс "+f.number+"\nВылет "+fmtTime(s.dep)+" ("+fmtDate(s.dep)+")"+
          (f.terminal?", терминал "+f.terminal:"");
      }
      box.innerHTML='<div class="alarms">'+esc(text)+
        '</div><button class="link" style="margin-top:8px" data-copyalarm="'+f.id+'">скопировать текст</button>';
      box.querySelector("[data-copyalarm]").onclick=function(){copyText(text);};
    };
  });
  app.querySelectorAll("[data-ics]").forEach(function(b){
    b.onclick=function(){
      var f=D.flights.filter(function(x){return x.id===b.dataset.ics;})[0];if(!f)return;
      var s=stagesOf(f);
      var alarms;
      if(f.checkinH||f.packH){
        alarms=[
          {minutesBefore:Math.round((s.dep-s.checkin)/60000),desc:"Быть в терминале — рейс "+f.number},
          {minutesBefore:Math.round((s.dep-s.pack)/60000),desc:"Пора собираться — рейс "+f.number}
        ];
      } else {
        alarms=[{minutesBefore:60,desc:"Посадка на рейс "+f.number}];
      }
      downloadICS("reys-"+f.number.replace(/\s+/g,"")+".ics",[{
        start:s.dep,end:new Date(s.dep.getTime()+30*60000),
        title:"Рейс "+f.number+(routeLabel(f)?" — "+routeLabel(f):""),
        description:(f.terminal?"Терминал "+f.terminal:"")+
          (f.checkinH||f.packH?"\nЯвка "+fmtTime(s.checkin)+", сборы "+fmtTime(s.pack):""),
        alarms:alarms
      }]);
    };
  });
}

var FLIGHT_LOOKUP_URL="https://flight-lookup.egortroschin302.workers.dev";
async function fetchFlightData(num,date){
  if(!num){toast("Впишите номер рейса");return null;}
  if(!FLIGHT_LOOKUP_URL){toast("Автопоиск не настроен — впишите данные вручную");return null;}
  try{
    var res=await fetch(FLIGHT_LOOKUP_URL+"?num="+encodeURIComponent(num)+"&date="+encodeURIComponent(date||""));
    var data=await res.json();
    if(!res.ok||data.error){toast("Рейс не найден — впишите вручную");return null;}
    return data;
  }catch(e){
    toast("Не удалось получить данные — впишите вручную");return null;
  }
}
function bindForm(){
  var s=document.getElementById("fSave");
  if(!s)return;
  var lk=document.getElementById("fLookup");

    var num=document.getElementById("fNum").value.trim();
    var date=document.getElementById("fDate").value;
    lk.textContent="ищу…";
    var data=await fetchFlightData(num,date);
    if(data){
      if(data.dep_time){
        var parts=data.dep_time.split(" ");
        document.getElementById("fDate").value=parts[0];
        document.getElementById("fTime").value=(parts[1]||"").slice(0,5);
      }
      if(data.arr_time)document.getElementById("fArr").value=(data.arr_time.split(" ")[1]||"").slice(0,5);
      if(data.dep_terminal)document.getElementById("fTerm").value=data.dep_terminal;
      if(data.dep_iata)document.getElementById("fFrom").value=data.dep_iata;
      if(data.arr_iata)document.getElementById("fTo").value=data.arr_iata;
      toast("Данные подставлены — проверьте перед сохранением");
    }
    lk.textContent="найти рейс";
  };
  s.onclick=function(){
    var num=document.getElementById("fNum").value.trim();
    var date=document.getElementById("fDate").value;
    var time=document.getElementById("fTime").value;
    if(!num||!date||!time){toast("Заполните номер, дату и время");return;}
    D.flights.push({
      id:uid(),number:num,
      from:document.getElementById("fFrom").value.trim(),
      to:document.getElementById("fTo").value.trim(),
      date:date,time:time,

var Week=(function(){
var KEY="week:v1";
var DOWF=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
var DOWS=["пн","вт","ср","чт","пт","сб","вс"];
var MSHORT=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var HSTART=6,HEND=24,SLOT=15,ROWS_H=60/SLOT;
var LIGHT_BLK=["#EFE1D3","#E4CBB0","#D8B694","#C79B75","#A9805E","#8B6547"];
var DARK_BLK=["#4B3B2C","#5C4632","#6E5238","#7F5E3E","#8F6B47","#A67C53"];

var anchor=mondayOf(new Date()),selDay=0,adding=false,openId="",D=load(),saveTimer=null;

function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);
    return {events:o.events||[],catColors:o.catColors||{}};}}
  catch(e){}
  return {events:[],catColors:{}};
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify(D));
      var s=document.querySelector(".saved");
      if(s){s.classList.add("on");setTimeout(function(){s.classList.remove("on");},1300);}
    }catch(e){toast("Не удалось сохранить");}
  },300);
}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function p2(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function mondayOf(d){var x=new Date(d);var off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);x.setHours(0,0,0,0);return x;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove();},1800);}
function copyText(text){
  var done=function(ok){toast(ok?"Скопировано":"Скопировать не вышло");};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(function(){done(true);},fb);else fb();
  function fb(){try{var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";
    ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    var ok=document.execCommand("copy");document.body.removeChild(ta);done(ok);}catch(e){done(false);}}
}
function catColor(cat){
  var name=(cat||"без темы").toLowerCase().trim();
  if(!(name in D.catColors)){
    D.catColors[name]=Object.keys(D.catColors).length%6;
    save();
  }
  var idx=D.catColors[name];
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  return {css:"var(--blk"+(idx+1)+")",hex:(dark?DARK_BLK:LIGHT_BLK)[idx]};
}
function toMin(t){var a=t.split(":");return (+a[0])*60+(+a[1]);}
function weekRange(){var end=addDays(anchor,6);
  var sm=anchor.getMonth(),em=end.getMonth();
  if(sm===em)return anchor.getDate()+"–"+end.getDate()+" "+MSHORT[em];
  return anchor.getDate()+" "+MSHORT[sm]+" – "+end.getDate()+" "+MSHORT[em];
}
function eventsInWeek(){
  var days=[];for(var i=0;i<7;i++)days.push(iso(addDays(anchor,i)));
  return D.events.filter(function(e){return days.indexOf(e.date)>=0;});
}

var app=null;
function render(){
  app=document.getElementById("content");
  var evs=eventsInWeek(),h="";

  h+='<div class="wk-head"><span class="wk-range">'+weekRange()+'</span>'+
     '<div class="wk-nav"><button class="step" id="wprev">‹</button><span class="saved">сохранено</span>'+
     '<button class="step" id="wnext">›</button></div></div>';

  h+= adding ? addFormHTML() : '<button class="wk-toggle" id="openAdd">+ добавить дело</button>';

  var openEv=evs.filter(function(e){return e.id===openId;})[0];
  if(openEv){
    var d=new Date(openEv.date);
    h+='<div class="wk-detail"><div class="wk-detail-t">'+esc(openEv.text)+'</div>'+
       '<div class="wk-detail-m">'+DOWF[(d.getDay()+6)%7]+", "+d.getDate()+" "+MSHORT[d.getMonth()]+
       " · "+openEv.start+"–"+openEv.end+(openEv.cat?" · "+esc(openEv.cat):"")+'</div>'+
       '<button class="link" id="delEv" data-id="'+openEv.id+'">удалить</button></div>';
  }

  h+=gridHTML(evs);

  var cats={};
  evs.forEach(function(e){var c=e.cat||"без темы";cats[c]=catColor(c);});
  var names=Object.keys(cats);
  if(names.length){
    h+='<div class="sec-h"><span class="sec-t">цветовой код</span></div><div class="wk-legend">';
    names.sort().forEach(function(n){
      h+='<div class="wk-leg-row"><span class="wk-swatch" style="background:'+cats[n].css+'"></span>'+
         '<span>'+esc(n)+'</span><span class="wk-leg-hex">'+cats[n].hex+'</span></div>';
    });
    h+='</div>';
  }

  h+='<div class="tools"><button class="link" id="copyWeek">скопировать неделю</button>'+
     '<button class="link" id="icsWeek">в календарь</button>'+
     '<button class="link" id="todayWeek">на этой неделе</button></div>';

  app.innerHTML=h;
  bind(evs);
}

function gridHTML(evs){
  var hours=[];for(var h=HSTART;h<HEND;h++)hours.push(h);
  var totalRows=hours.length*ROWS_H;
  var out='<div class="wk-grid" style="grid-template-rows:20px repeat('+totalRows+',9px)">';
  out+='<div class="wk-corner" style="grid-column:1;grid-row:1"></div>';
  for(var d=0;d<7;d++){
    var dt=addDays(anchor,d),isToday=iso(dt)===iso(new Date()),isWeekend=d>=5;
    out+='<div class="wk-dow'+(isWeekend?" weekend":"")+'" style="grid-column:'+(d+2)+';grid-row:1'+
      (isToday?';color:var(--plum)':'')+'">'+DOWS[d]+' '+dt.getDate()+'</div>';
  }
  hours.forEach(function(hr,i){
    var r0=2+i*ROWS_H;
    out+='<div class="wk-hourlabel" style="grid-column:1;grid-row:'+r0+' / span '+ROWS_H+'">'+hr+'</div>';
    for(var d2=0;d2<7;d2++)
      out+='<div class="wk-cell'+(d2>=5?" weekend":"")+'" data-add-day="'+d2+'" data-add-hour="'+hr+
        '" style="grid-column:'+(d2+2)+';grid-row:'+r0+' / span '+ROWS_H+'"></div>';
  });
  evs.forEach(function(e){
    var dayIdx=-1;
    for(var i2=0;i2<7;i2++)if(iso(addDays(anchor,i2))===e.date)dayIdx=i2;
    if(dayIdx<0)return;
    var s=Math.max(toMin(e.start),HSTART*60),en=Math.min(toMin(e.end),HEND*60);
    if(en<=s)return;
    var rowStart=2+Math.round((s-HSTART*60)/SLOT);
    var rowEnd=2+Math.round((en-HSTART*60)/SLOT);
    var col=catColor(e.cat);
    out+='<div class="wk-block'+(openId===e.id?" sel":"")+'" data-open="'+e.id+
      '" style="grid-column:'+(dayIdx+2)+';grid-row:'+rowStart+' / '+rowEnd+';background:'+col.css+'">'+
      '<b>'+esc(e.text)+'</b>'+e.start+'</div>';
  });
  out+='</div>';
  return out;
}

function addFormHTML(){
  var days=[];for(var i=0;i<7;i++)days.push(addDays(anchor,i));
  var h='<div class="wk-add"><div class="wk-daypick">';
  days.forEach(function(d,i){
    h+='<button class="wk-daybtn'+(selDay===i?" sel":"")+'" data-pickday="'+i+'">'+DOWS[i]+
       '<span class="n">'+d.getDate()+'</span></button>';
  });
  h+='</div><div class="frow"><div class="field sm"><label>Начало</label><input id="wStart" type="time" value="09:00"></div>'+
     '<div class="field sm"><label>Конец</label><input id="wEnd" type="time" value="10:00"></div>'+
     '<div class="field"><label>Дело</label><input id="wText" placeholder="тренировка"></div></div>'+
     '<div class="frow"><div class="field"><label>Категория</label><input id="wCat" placeholder="спорт, учёба, работа…" list="wCatList">'+
     '<datalist id="wCatList">'+catList().map(function(c){return '<option value="'+esc(c)+'">';}).join("")+
     '</datalist></div></div>'+
     '<div class="submit" id="wSave">Добавить</div></div>';
  return h;
}
function catList(){
  var set={};D.events.forEach(function(e){if(e.cat)set[e.cat]=1;});return Object.keys(set);
}

function bind(evs){
  document.getElementById("wprev").onclick=function(){anchor=addDays(anchor,-7);openId="";render();};
  document.getElementById("wnext").onclick=function(){anchor=addDays(anchor,7);openId="";render();};
  document.getElementById("todayWeek").onclick=function(){anchor=mondayOf(new Date());openId="";render();};
  document.getElementById("icsWeek").onclick=function(){
    var items=evs.map(function(e){
      var d=new Date(e.date+"T"+e.start+":00"),en=new Date(e.date+"T"+e.end+":00");
      return {start:d,end:en,title:e.text+(e.cat?" ("+e.cat+")":""),alarms:[{minutesBefore:10}]};
    });
    downloadICS("nedelya-"+iso(anchor)+".ics",items);
  };
  document.getElementById("copyWeek").onclick=function(){
    var out=["Неделя "+weekRange(),""];
    var byDay={};evs.forEach(function(e){(byDay[e.date]=byDay[e.date]||[]).push(e);});
    Object.keys(byDay).sort().forEach(function(dt){
      var d=new Date(dt);out.push(DOWF[(d.getDay()+6)%7]+" "+d.getDate()+" "+MSHORT[d.getMonth()]+":");
      byDay[dt].sort(function(a,b){return toMin(a.start)-toMin(b.start);}).forEach(function(e){
        out.push("  "+e.start+"–"+e.end+" "+e.text+(e.cat?" ("+e.cat+")":""));});
    });
    copyText(out.join("\n"));
  };
  var oa=document.getElementById("openAdd");
  if(oa)oa.onclick=function(){adding=true;selDay=0;render();};
  app.querySelectorAll("[data-pickday]").forEach(function(b){
    b.onclick=function(){selDay=+b.dataset.pickday;render();};
  });
  app.querySelectorAll("[data-add-day]").forEach(function(c){
    c.onclick=function(){
      adding=true;selDay=+c.dataset.addDay;
      render();
      var st=document.getElementById("wStart");
      if(st)st.value=p2(+c.dataset.addHour)+":00";
      var en=document.getElementById("wEnd");
      if(en)en.value=p2(Math.min(+c.dataset.addHour+1,23))+":00";
    };
  });
  var saveBtn=document.getElementById("wSave");
  if(saveBtn)saveBtn.onclick=function(){
    var start=document.getElementById("wStart").value;
    var end=document.getElementById("wEnd").value;
    var text=document.getElementById("wText").value.trim();
    var cat=document.getElementById("wCat").value.trim();
    if(!text||!start||!end){toast("Впишите дело и время");return;}
    if(toMin(end)<=toMin(start)){toast("Конец раньше начала");return;}
    D.events.push({id:uid(),date:iso(addDays(anchor,selDay)),start:start,end:end,text:text,cat:cat});
    adding=false;save();render();
  };
  app.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick=function(e){e.stopPropagation();openId=openId===b.dataset.open?"":b.dataset.open;render();};
  });
  var del=document.getElementById("delEv");
  if(del)del.onclick=function(){
    D.events=D.events.filter(function(x){return x.id!==del.dataset.id;});
    openId="";save();render();
  };
}

return {render:render};
})();

function emptyBlock(text){

    (SEASON_GLYPHS[s]||SEASON_GLYPHS.autumn)+'</svg><p class="empty">'+text+'</p></div>';

var SEASON_ORDER=["auto","winter","spring","summer","autumn"];
var FX_CONF={
  winter:{shape:"snow",count:16,anim:"fxFall",dur:[10,18],size:[4,8]},
  spring:{shape:"leaf",count:10,anim:"fxFall",dur:[14,22],size:[9,14]},
  summer:{shape:"snow",count:8,anim:"fxRise",dur:[16,26],size:[5,9]},
  autumn:{shape:"leaf",count:12,anim:"fxFall",dur:[11,19],size:[10,16]}
};
function seasonOf(d){
  var m=d.getMonth();
  if(m===11||m===0||m===1)return "winter";
  if(m>=2&&m<=4)return "spring";
  if(m>=5&&m<=7)return "summer";
  return "autumn";
}
function seasonOverride(){
  try{return localStorage.getItem("season:v1")||"auto";}catch(e){return "auto";}
}
function effectiveSeason(){
  var o=seasonOverride();
  return o==="auto"?seasonOf(new Date()):o;
}
function renderSeasonFX(season){
  var box=document.getElementById("seasonFX");
  if(!box)return;
  var c=FX_CONF[season]||FX_CONF.autumn;
  var h="";
  for(var i=0;i<c.count;i++){
    var left=Math.round(Math.random()*100);
    var dur=(c.dur[0]+Math.random()*(c.dur[1]-c.dur[0])).toFixed(1);
    var delay=(-Math.random()*dur).toFixed(1);
    var size=Math.round(c.size[0]+Math.random()*(c.size[1]-c.size[0]));
    var sway=Math.round(-30+Math.random()*60);
    h+='<span class="fx fx-'+c.shape+'" style="left:'+left+'%;width:'+size+'px;height:'+size+'px;'+
       'animation:'+c.anim+' '+dur+'s linear infinite;animation-delay:'+delay+'s;--sway:'+sway+'px"></span>';
  }
  box.innerHTML=h;
}
function applySeason(){
  var s=effectiveSeason();
  document.documentElement.setAttribute("data-season",s);
  renderSeasonFX(s);

};
document.getElementById("hardReset").onclick=function(){
  if(!confirm("Обновить приложение до последней версии? Ваши записи не удалятся, обновится только код."))return;
  var done=function(){location.reload(true);};
  var tasks=[];
  if("serviceWorker" in navigator)
    tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){return r.unregister();}));
    }));
  if("caches" in window)
    tasks.push(caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){return caches.delete(k);}));
    }));
  Promise.all(tasks).then(done).catch(done);
};
initTheme();
applySeason();
showTab("planner");
if("serviceWorker" in navigator)
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});

</script>
